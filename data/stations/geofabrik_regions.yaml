# Манифест Geofabrik extract'ов для build_osm_esr_index.py (пункт 3 плана).
# cache_dir — каталог загрузки PBF (относительно корня репозитория).

version: 1
cache_dir: data/stations/cache/pbf
base_url: https://download.geofabrik.de

# Порядок merge в osm_esr_index: по возрастанию priority (сначала низкий — перезапись выше).
regions:
  - id: russia
    geofabrik_slug: russia-latest
    region_group: ru
    priority: 10
    required: true

  - id: belarus
    geofabrik_slug: belarus-latest
    region_group: cis
    country_iso: BY
    priority: 20

  - id: kazakhstan
    geofabrik_slug: kazakhstan-latest
    region_group: cis
    country_iso: KZ
    priority: 20

  - id: ukraine
    geofabrik_slug: ukraine-latest
    region_group: cis
    country_iso: UA
    priority: 20

  - id: moldova
    geofabrik_slug: moldova-latest
    region_group: cis
    country_iso: MD
    priority: 20

  - id: uzbekistan
    geofabrik_slug: uzbekistan-latest
    region_group: cis
    country_iso: UZ
    priority: 20

  - id: turkmenistan
    geofabrik_slug: turkmenistan-latest
    region_group: cis
    country_iso: TM
    priority: 20

  - id: tajikistan
    geofabrik_slug: tajikistan-latest
    region_group: cis
    country_iso: TJ
    priority: 20

  - id: kyrgyzstan
    geofabrik_slug: kyrgyzstan-latest
    region_group: cis
    country_iso: KG
    priority: 20

  - id: latvia
    geofabrik_slug: latvia-latest
    region_group: baltic
    country_iso: LV
    priority: 20

  - id: lithuania
    geofabrik_slug: lithuania-latest
    region_group: baltic
    country_iso: LT
    priority: 20

  - id: estonia
    geofabrik_slug: estonia-latest
    region_group: baltic
    country_iso: EE
    priority: 20

  - id: georgia
    geofabrik_slug: georgia-latest
    region_group: south_caucasus
    country_iso: GE
    priority: 20

  - id: armenia
    geofabrik_slug: armenia-latest
    region_group: south_caucasus
    country_iso: AM
    priority: 20

  - id: azerbaijan
    geofabrik_slug: azerbaijan-latest
    region_group: south_caucasus
    country_iso: AZ
    priority: 20

  - id: mongolia
    geofabrik_slug: mongolia-latest
    region_group: china_mongolia
    country_iso: MN
    priority: 20

  # Полный china-latest ~1.3 GB; для пограничных ж/д станций — bbox Забайкалья/Приморья/Синьцзяна.
  - id: china_border
    geofabrik_slug: china-latest
    region_group: china_mongolia
    country_iso: CN
    priority: 25
    optional: true
    bbox: [73.0, 41.0, 135.0, 53.5]
    note: "osmium extract --bbox после скачивания полного PBF"
