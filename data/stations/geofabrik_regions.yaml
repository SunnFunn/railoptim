# Манифест Geofabrik extract'ов для build_osm_esr_index.py.
# geofabrik_slug — путь относительно base_url (см. структуру download.geofabrik.de).

version: 1
cache_dir: data/stations/cache/pbf
base_url: https://download.geofabrik.de

regions:
  - id: russia
    geofabrik_slug: russia-latest
    region_group: ru
    priority: 10
    required: true

  - id: belarus
    geofabrik_slug: europe/belarus-latest
    region_group: cis
    country_iso: BY
    priority: 20

  - id: kazakhstan
    geofabrik_slug: asia/kazakhstan-latest
    region_group: cis
    country_iso: KZ
    priority: 20

  - id: ukraine
    geofabrik_slug: europe/ukraine-latest
    region_group: cis
    country_iso: UA
    priority: 20

  - id: moldova
    geofabrik_slug: europe/moldova-latest
    region_group: cis
    country_iso: MD
    priority: 20

  - id: uzbekistan
    geofabrik_slug: asia/uzbekistan-latest
    region_group: cis
    country_iso: UZ
    priority: 20

  - id: turkmenistan
    geofabrik_slug: asia/turkmenistan-latest
    region_group: cis
    country_iso: TM
    priority: 20

  - id: tajikistan
    geofabrik_slug: asia/tajikistan-latest
    region_group: cis
    country_iso: TJ
    priority: 20

  - id: kyrgyzstan
    geofabrik_slug: asia/kyrgyzstan-latest
    region_group: cis
    country_iso: KG
    priority: 20

  - id: latvia
    geofabrik_slug: europe/latvia-latest
    region_group: baltic
    country_iso: LV
    priority: 20

  - id: lithuania
    geofabrik_slug: europe/lithuania-latest
    region_group: baltic
    country_iso: LT
    priority: 20

  - id: estonia
    geofabrik_slug: europe/estonia-latest
    region_group: baltic
    country_iso: EE
    priority: 20

  - id: georgia
    geofabrik_slug: europe/georgia-latest
    region_group: south_caucasus
    country_iso: GE
    priority: 20

  - id: armenia
    geofabrik_slug: asia/armenia-latest
    region_group: south_caucasus
    country_iso: AM
    priority: 20

  - id: azerbaijan
    geofabrik_slug: asia/azerbaijan-latest
    region_group: south_caucasus
    country_iso: AZ
    priority: 20

  - id: mongolia
    geofabrik_slug: asia/mongolia-latest
    region_group: china_mongolia
    country_iso: MN
    priority: 20

  - id: china_border
    geofabrik_slug: asia/china-latest
    region_group: china_mongolia
    country_iso: CN
    priority: 25
    optional: true
    bbox: [73.0, 41.0, 135.0, 53.5]
    note: "bbox-фильтр при extract (без отдельного osmium extract)"
