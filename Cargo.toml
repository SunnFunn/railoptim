[package]
name = "railoptim"
version = "0.1.0"
edition = "2024"

[lib]
name = "railoptim"
path = "src/lib.rs"

[[bin]]
name = "railoptim"
path = "src/main.rs"

[[bin]]
name = "railoptim-web"
path = "src/bin/web.rs"

[[bin]]
name = "railoptim-load-stations"
path = "src/bin/build_load_stations.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
chrono = { version = "0.4.44", features = ["serde"] }
highs = "2.0.0"
ndarray = "0.17.2"
rand = "0.8"
reqwest = { version = "0.13.2", features = ["json", "query", "rustls"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
rust_xlsxwriter = "0.94.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zeroize = { version = "1.8.2", features = ["derive"] }
calamine = "0.35.0"
